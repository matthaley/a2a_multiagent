[project]
name = "airbnb_planner_multiagent"
version = "0.1.0"
description = "Plan a trip using a multi-agent system communicating over A2A and using MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.0",
    "geopy>=2.4.1",
    "google-adk>=1.15.0",
    "gradio>=5.30.0,<6.0.0",
    "langchain-google-genai>=2.1.5",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-google-vertexai>=2.0.24",
    "langgraph>=0.4.5",
    "mcp>=1.5.0",
    "a2a-sdk>=0.3.0",
    "litellm",
    "Flask==3.0.0",
    "flask-cors==4.0.1",
    "python-dotenv==1.0.1",
    "PyJWT[crypto]==2.8.0",
    "requests>=2.32.4,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["airbnb_agent*", "host_agent*", "weather_agent*", "auth_lib*", "calendar_agent*", "horizon_agent*", "idp*", "demo_agent_registry*"]

[tool.uv.sources]
a2a-samples = { workspace = true }
