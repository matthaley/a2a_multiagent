apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: horizon-integration-test--idp-service
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    # Ingress setting - must comply with organization policy
    # Options: "all" (public), "internal" (VPC only), "internal-and-cloud-load-balancing"
    run.googleapis.com/ingress: "all"
spec:
  template:
    metadata:
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      # Service account for accessing GCP resources
      serviceAccountName: GCP_SERVICE_ACCOUNT_PLACEHOLDER
      containers:
      # Artifact Registry image path: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY_NAME/IMAGE_NAME:TAG
      # Replace REPOSITORY_NAME with your Artifact Registry repository name
      - image: us-central1-docker.pkg.dev/GCP_PROJECT_ID_PLACEHOLDER/horizon-integration-test/idp:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        # Required: Public URL where the IDP is accessible
        # Update this to your Cloud Run service URL after deployment
        # After deployment, run: gcloud run services describe horizon-integration-test--idp-service --region=us-central1 --format="value(status.url)"
        - name: APP_URL
          value: "https://horizon-integration-test--idp-service-GCP_PROJECT_NUMBER_PLACEHOLDER.us-central1.run.app"
        # Optional: Google API Key (if not using Vertex AI)
        # Uncomment and set via Secret Manager for production
        # - name: GOOGLE_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: google-api-key
        #       key: api-key
        # Optional: Use Vertex AI instead of API key
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "TRUE"
        # Note: Cloud Run automatically sets PORT env var (usually 8080)
        # We read it in the Python code via os.environ.get("PORT", "5000")
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
        command:
        - python
        - -m
        - idp
        args:
        - --host
        - "0.0.0.0"
        - --log-level
        - "info"
      # Health check is handled by Cloud Run's readiness probe
      # Cloud Run will automatically check the service endpoint
